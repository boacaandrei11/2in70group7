<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 720" width="1300" height="720">
  <style>
    text { font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #1e293b; }
    .h  { font-size: 18px; font-weight: 700; }
    .h2 { font-size: 14.5px; font-weight: 700; }
    .s  { font-size: 13px; fill: #475569; }
    .xs { font-size: 12px; fill: #475569; }
    .mono { font-family: Consolas, "Cascadia Mono", Menlo, monospace; font-size: 12px; fill: #334155; }
    .tag { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
    .blk { font-size: 11.5px; fill: #0f766e; font-weight: 600; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
  </defs>

  <rect x="1" y="1" width="1298" height="718" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="30" y="40" class="tag" style="fill:#64748b">RUNTIME ARCHITECTURE  ·  WHERE DECISIONS HAPPEN</text>

  <!-- Rhapsody container -->
  <rect x="30" y="62" width="760" height="626" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
  <text x="54" y="94" class="tag" style="fill:#0f766e">IBM RHAPSODY 9.0  ·  SOURCE OF TRUTH</text>
  <text x="54" y="120" class="h">SmartIntersectionCore — executable SysML model</text>

  <!-- SimulationController -->
  <rect x="54" y="140" width="610" height="90" rx="10" fill="#ffffff" stroke="#14b8a6" stroke-width="1.6"/>
  <text x="72" y="164" class="blk">«block»</text>
  <text x="122" y="165" class="h2">SimulationController</text>
  <text x="72" y="192" class="xs">owns simulation time: fixed step dt = 0.1 s · start / pause / step / reset</text>
  <text x="72" y="212" class="xs">each step: read commands → update signals &amp; agents → publish one snapshot</text>

  <!-- step arrows -->
  <line x1="150" y1="232" x2="150" y2="256" stroke="#0f766e" stroke-width="1.6" marker-end="url(#t)"/>
  <line x1="360" y1="232" x2="360" y2="256" stroke="#0f766e" stroke-width="1.6" marker-end="url(#t)"/>
  <line x1="570" y1="232" x2="570" y2="256" stroke="#0f766e" stroke-width="1.6" marker-end="url(#t)"/>
  <text x="160" y="250" class="xs">step</text><text x="370" y="250" class="xs">step</text><text x="580" y="250" class="xs">step</text>

  <!-- Row 2 -->
  <rect x="54" y="260" width="190" height="130" rx="10" fill="#ffffff" stroke="#14b8a6" stroke-width="1.6"/>
  <text x="70" y="282" class="blk">«block»</text>
  <text x="70" y="302" class="h2">TrafficSignal-</text>
  <text x="70" y="320" class="h2">Controller</text>
  <text x="70" y="344" class="xs">NS / EW phases, amber,</text>
  <text x="70" y="360" class="xs">all-red, pedestrian walk</text>
  <text x="70" y="376" class="xs">validates timing plans</text>

  <rect x="264" y="260" width="190" height="130" rx="10" fill="#ffffff" stroke="#14b8a6" stroke-width="1.6"/>
  <text x="280" y="282" class="blk">«block»</text>
  <text x="280" y="302" class="h2">PedestrianAgent  ×n</text>
  <text x="280" y="326" class="xs">waiting → requesting →</text>
  <text x="280" y="342" class="xs">crossing → completed</text>
  <text x="280" y="360" class="xs">position · speed · state</text>

  <rect x="474" y="260" width="190" height="130" rx="10" fill="#ffffff" stroke="#14b8a6" stroke-width="1.6"/>
  <text x="490" y="282" class="blk">«block»</text>
  <text x="490" y="302" class="h2">VehicleAgent  ×n</text>
  <text x="490" y="326" class="xs">SmartVehicle /</text>
  <text x="490" y="342" class="xs">ConventionalVehicle</text>
  <text x="490" y="360" class="xs">position · speed · state</text>
  <text x="490" y="376" class="xs">stop / yield / proceed</text>

  <!-- inter-block flows -->
  <line x1="262" y1="325" x2="246" y2="325" stroke="#0f766e" stroke-width="1.6" marker-end="url(#t)"/>
  <path d="M149 392 v20 H569 v-20" fill="none" stroke="#0f766e" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#t)"/>
  <text x="200" y="430" class="xs">crossing request → controller  ·  commanded signal indications → vehicles</text>

  <!-- Row 3 -->
  <rect x="54" y="446" width="295" height="70" rx="10" fill="#ffffff" stroke="#14b8a6" stroke-width="1.6"/>
  <text x="70" y="468" class="blk">«block»</text>
  <text x="122" y="469" class="h2">ScenarioManager</text>
  <text x="70" y="496" class="xs">loads scenario + seed, spawns agents</text>
  <rect x="369" y="446" width="295" height="70" rx="10" fill="#ffffff" stroke="#14b8a6" stroke-width="1.6"/>
  <text x="385" y="468" class="blk">«block»</text>
  <text x="437" y="469" class="h2">IntersectionGeometry</text>
  <text x="385" y="496" class="xs">lanes · stop lines · crossings (metres)</text>

  <!-- ports -->
  <rect x="690" y="140" width="80" height="42" rx="7" fill="#0f766e"/>
  <text x="730" y="157" text-anchor="middle" style="font-size:11.5px;font-weight:700;fill:#ffffff">Telemetry</text>
  <text x="730" y="173" text-anchor="middle" style="font-size:11.5px;font-weight:700;fill:#ffffff">Port</text>
  <rect x="690" y="190" width="80" height="42" rx="7" fill="#0f766e"/>
  <text x="730" y="207" text-anchor="middle" style="font-size:11.5px;font-weight:700;fill:#ffffff">Command</text>
  <text x="730" y="223" text-anchor="middle" style="font-size:11.5px;font-weight:700;fill:#ffffff">Port</text>
  <rect x="690" y="303" width="80" height="44" rx="7" fill="#ffffff" stroke="#b45309" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="730" y="321" text-anchor="middle" style="font-size:11.5px;font-weight:700;fill:#b45309">Perception</text>
  <text x="730" y="337" text-anchor="middle" style="font-size:11.5px;font-weight:700;fill:#b45309">Port</text>
  <line x1="666" y1="161" x2="688" y2="161" stroke="#0f766e" stroke-width="1.6" marker-end="url(#t)"/>
  <line x1="688" y1="211" x2="666" y2="211" stroke="#0f766e" stroke-width="1.6" marker-end="url(#t)"/>
  <line x1="688" y1="325" x2="666" y2="325" stroke="#b45309" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#am)"/>
  <text x="682" y="370" class="xs" style="fill:#b45309">observed world</text>
  <text x="682" y="385" class="xs" style="fill:#b45309">→ smart vehicles</text>

  <!-- execution band -->
  <rect x="54" y="540" width="716" height="126" rx="10" fill="#e2e8f0"/>
  <text x="74" y="566" class="tag" style="fill:#334155">EXECUTION</text>
  <text x="74" y="592" class="s"><tspan style="font-weight:700;fill:#1e293b">Rhapsody-generated C++</tspan> from the state machines and operations above,</text>
  <text x="74" y="612" class="s">compiled with the Visual Studio (MSVC) toolchain, animated live in Rhapsody.</text>
  <text x="74" y="640" class="s"><tspan style="font-weight:700;fill:#1e293b">bridge/</tspan> hand-written C++ used only by the ports:</text>
  <text x="400" y="640" class="mono">UdpLink · StateSerializer · CommandParser</text>

  <!-- transport -->
  <line x1="772" y1="161" x2="896" y2="161" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="800" y="136" class="xs" style="font-weight:600">state snapshot</text>
  <text x="800" y="151" class="xs">:50010</text>
  <line x1="896" y1="211" x2="772" y2="211" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="800" y="232" class="xs" style="font-weight:600">commands</text>
  <text x="800" y="247" class="xs">:50011</text>
  <text x="800" y="270" class="xs">JSON over UDP;</text>
  <text x="800" y="285" class="xs">each command</text>
  <text x="800" y="300" class="xs">gets an ack</text>
  <!-- Python dashboard -->
  <rect x="898" y="62" width="372" height="370" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="920" y="94" class="tag" style="fill:#1d4ed8">PYTHON  ·  DISPLAY &amp; REQUESTS ONLY</text>
  <text x="920" y="120" class="h">Operator dashboard (Pygame)</text>
  <rect x="920" y="140" width="328" height="70" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="936" y="166" class="h2" style="font-size:13.5px">Top-down map</text>
  <text x="936" y="190" class="xs">draws model positions; may interpolate, never decides</text>
  <rect x="920" y="220" width="328" height="70" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="936" y="246" class="h2" style="font-size:13.5px">Telemetry</text>
  <text x="936" y="270" class="xs">phase countdown · agent states · queues · events</text>
  <rect x="920" y="300" width="328" height="70" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="936" y="326" class="h2" style="font-size:13.5px">Configuration</text>
  <text x="936" y="350" class="xs">sends requests; shows a value as active only after ack</text>
  <text x="920" y="408" class="xs">Development aid: tools/mock_sim.py replays protocol-valid</text>
  <text x="920" y="424" class="xs">snapshots so the UI can be built in parallel (never in the demo).</text>

  <!-- ML -->
  <rect x="898" y="470" width="372" height="196" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="920" y="502" class="tag" style="fill:#b45309">PYTHON  ·  PLANNED EXTENSION (STRETCH)</text>
  <text x="920" y="528" class="h">ML perception service</text>
  <text x="920" y="556" class="xs">pretrained detector on camera-like images</text>
  <text x="920" y="574" class="xs">→ class · bbox · confidence · light state</text>
  <text x="920" y="604" class="xs">Starts as idealized detection events inside the model;</text>
  <text x="920" y="620" class="xs">only observations cross the port — no direct control.</text>
  <path d="M896 568 H846 V325 H772" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#am)"/>
  <text x="852" y="460" class="xs" style="font-weight:600;fill:#b45309">detections</text>
</svg>
