<text x="800" y="54" class="tag">INTERSECTION LAYOUT  ·  ODD BASELINE  ·  MAP CONCEPT</text>
<text x="800" y="84" class="h">Four-arm signalised junction</text>
<text x="800" y="108" class="s">Shown at phase <tspan style="font-weight:700;fill:#15803d">NS_GREEN</tspan> (EW red).</text>
<rect x="806" y="150" width="26" height="18" rx="4" transform="translate(0,-12)" fill="#0f766e" stroke="#99f6e4" stroke-width="2"/>
<text x="850" y="155" class="h2">Smart vehicle</text>
<text x="850" y="173" class="s">perception → decision, distinct marker</text>
<rect x="806" y="206" width="26" height="18" rx="4" transform="translate(0,-12)" fill="#64748b" stroke="#cbd5e1" stroke-width="2"/>
<text x="850" y="211" class="h2">Conventional vehicle</text>
<text x="850" y="229" class="s">obeys signals and right-of-way</text>
<path d="M812 262 l14 14 m0 -14 l-14 14" transform="translate(0,-9)" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/>
<text x="850" y="267" class="h2">Pedestrian (X)</text>
<text x="850" y="285" class="s">uses the zebra crossings</text>
<g transform="translate(0,-10)"><rect x="804" y="318" width="38" height="14" rx="3" fill="#111827"/><circle cx="811" cy="0" r="4" fill="#ef4444" transform="translate(0,318) translate(0,7)"/><circle cx="823" cy="0" r="4" fill="#374151" transform="translate(0,318) translate(0,7)"/><circle cx="835" cy="0" r="4" fill="#374151" transform="translate(0,318) translate(0,7)"/></g>
<text x="850" y="323" class="h2">Signal head</text>
<text x="850" y="341" class="s">state comes from the model, not a UI timer</text>
<g transform="translate(0,-10)"><rect x="804" y="374" width="38" height="16" fill="#3f4b59"/><rect x="820" y="374" width="5" height="16" fill="#fff"/></g>
<text x="850" y="379" class="h2">Stop line</text>
<text x="850" y="397" class="s">vehicles must not cross it on red</text>
<path d="M823 430 l-16 -14 a 22 22 0 0 1 32 0 z" transform="translate(0,6)" fill="#14b8a6" fill-opacity=".35"/>
<text x="850" y="435" class="h2">Perception range</text>
<text x="850" y="453" class="s">smart vehicle observes, not the ground truth</text>
<rect x="796" y="492" width="400" height="196" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="814" y="520" class="tag">ODD ASSUMPTIONS (MILESTONE 1)</text>
<text x="814" y="546" class="s">• One lane in / out per arm, right-hand traffic</text>
<text x="814" y="567" class="s">• Straight-through movements only (no turns)</text>
<text x="814" y="588" class="s">• ≤ 4 vehicles · 2–6 pedestrians at once</text>
<text x="814" y="609" class="s">• Vehicles 0–8.5 m/s · pedestrians 0.8–1.8 m/s</text>
<text x="814" y="630" class="s">• World frame in metres, origin at the centre,</text>
<text x="814" y="651" class="s">   x east, y north — Python only scales to pixels</text>
